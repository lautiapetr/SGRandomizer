name: CI and desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Reject tracked game and build artifacts
        run: python scripts/verify_bundle.py --tracked
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy src/sgrand

  windows-x64:
    needs: test
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
      - run: python -m pip install '.[packaging]'
      - run: python -m PyInstaller --noconfirm --clean packaging/sgrand.spec
      - name: Smoke-test frozen application
        shell: pwsh
        run: dist/SGRand/SGRand.exe --smoke-test
      - name: Verify package contains no game artifacts
        shell: pwsh
        run: python scripts/verify_bundle.py dist/SGRand
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path dist/SGRand -DestinationPath SGRand-Windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: SGRand-Windows-x64
          path: SGRand-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux-appimage:
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install '.[packaging]'
      - run: python -m PyInstaller --noconfirm --clean packaging/sgrand.spec
      - name: Smoke-test frozen application
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/SGRand/SGRand --smoke-test
      - name: Assemble AppDir
        run: |
          mkdir -p AppDir/usr/lib/sgrand AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/scalable/apps
          cp -a dist/SGRand/. AppDir/usr/lib/sgrand/
          cp packaging/linux/AppRun AppDir/AppRun
          cp packaging/linux/sgrand.desktop AppDir/sgrand.desktop
          cp packaging/linux/sgrand.desktop AppDir/usr/share/applications/
          cp packaging/linux/sgrand.svg AppDir/sgrand.svg
          cp packaging/linux/sgrand.svg AppDir/usr/share/icons/hicolor/scalable/apps/
          chmod +x AppDir/AppRun
      - name: Build AppImage
        run: |
          curl -L --fail --retry 3 -o appimagetool.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir SGRand-Linux-x86_64.AppImage
      - name: Verify package contains no game artifacts
        run: python scripts/verify_bundle.py AppDir
      - uses: actions/upload-artifact@v7
        with:
          name: SGRand-Linux-AppImage
          path: SGRand-Linux-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x64
            artifact: SGRand-macOS-Intel
          - runner: macos-15
            architecture: arm64
            artifact: SGRand-macOS-Apple-Silicon
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}
          cache: pip
      - run: python -m pip install '.[packaging]'
      - run: python -m PyInstaller --noconfirm --clean packaging/sgrand.spec
      - name: Smoke-test frozen application
        run: dist/SGRand.app/Contents/MacOS/SGRand --smoke-test
      - name: Verify package contains no game artifacts
        run: python scripts/verify_bundle.py dist/SGRand.app
      - name: Create archive
        run: ditto -c -k --sequesterRsrc --keepParent dist/SGRand.app "${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 14
